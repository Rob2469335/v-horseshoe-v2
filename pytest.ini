[pytest]
testpaths = tests swarm_os/tests
python_files = test_*.py
asyncio_mode = auto
markers =
    asyncio: async test marker

# Silence upstream third-party warnings that are not ours to fix:
# - litellm uses asyncio.iscoroutinefunction (deprecated in 3.14, removed 3.16)
#   until the library is updated; fires on every litellm import in tests.
# - requests/urllib3 version-mismatch warning from the venv's requests install.
filterwarnings =
    ignore::DeprecationWarning:litellm\.litellm_core_utils\.logging_utils:273
    ignore:urllib3.*doesn't match a supported version:UserWarning
