name: CI

on:
  push:
    branches: [ main, master, "*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.16.3
        ports:
          - 6333:6333
        # NOTE: no --health-cmd here. GitHub Actions runs the service
        # container's healthcheck *inside* the container, but the slim
        # qdrant image does not bundle curl, so it never reports "healthy"
        # and the job aborts at "Initialize containers". We instead poll
        # /health from the runner host in the "Wait for Qdrant" step below
        # (where curl is available).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install dev tools (linting, typing, SCA)
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pip-audit

      - name: Run ruff
        run: |
          ruff check . || true

      - name: Run mypy
        run: |
          mypy --ignore-missing-imports . || true

      - name: Run pip-audit
        run: |
          pip-audit || true

      - name: Wait for Qdrant
        run: |
          for i in {1..20}; do
            if curl -sSf http://127.0.0.1:6333/health >/dev/null 2>&1; then
              echo "qdrant ready" && break
            fi
            echo "waiting for qdrant... ($i)"; sleep 2
          done

      - name: Run tests
        env:
          QDRANT_URL: http://127.0.0.1:6333
          SWARM_SEMANTIC_CACHE: '0'
          OPENROUTER_API_KEY: ''
        run: pytest -q
