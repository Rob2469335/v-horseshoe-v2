# Reference Qdrant server configuration — NOT loaded by any repository launcher.
#
# The native launchers (start-dev.ps1 STEP 3, start-dev-fixed.ps1 STEP 3) start
# qdrant.exe with no --config-path and pin the storage root through
# QDRANT__STORAGE__STORAGE_PATH, which outranks both Qdrant's defaults and any
# config file. This file is kept for a human who runs
# `qdrant.exe --config-path .qdrant/config/qdrant.yaml` by hand, and to document
# the intended settings in one place. It MUST NOT disagree with the launchers.
#
# Canonical storage root (operator-authorized 2026-10-03):
#   C:/Users/rober/Projects/v-horseshoe-v2/storage
# That directory holds the 15 production collections and is the source of the
# repository's snapshots\ directory. It was chosen on current effective use,
# collection inventory, exact snapshot collection-name correspondence, and
# historical launcher behavior — not on prior authority; see AGENTS.md §4.
#
# service.host is 127.0.0.1, NOT 0.0.0.0. Commit 882646a established that a
# 0.0.0.0 bind exposed the whole memory/chess/legal/codebase store to the LAN
# with no auth. Do not revert this line.
log_level: INFO

service:
  host: 127.0.0.1
  http_port: 6333
  grpc_port: 6334

storage:
  storage_path: 'C:/Users/rober/Projects/v-horseshoe-v2/storage'