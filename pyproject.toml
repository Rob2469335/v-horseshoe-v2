[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organism-console"
version = "0.1.0"
description = "Organism Console CLI AI runtime"
requires-python = ">=3.14"

[project.scripts]
organism = "organism_console.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["organism_console*"]


