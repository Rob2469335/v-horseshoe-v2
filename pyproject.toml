[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organism-console"
version = "0.1.0"
description = "Organism Console CLI AI runtime"
requires-python = ">=3.14"

[project.scripts]
organism = "organism_console.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["organism_console*", "swarm_os*", "runtime_v2*"]

[tool.ruff]
# .vulture_whitelist.py is a dead-code whitelist for vulture: it intentionally
# lists bare names (swarm_os, organism_console, Columns, ...) so the static
# analyzer treats them as used. Ruff's F821 (undefined name) flags these bare
# names on this file and must not be treated as a defect — exclude the file.
exclude = [".vulture_whitelist.py"]



